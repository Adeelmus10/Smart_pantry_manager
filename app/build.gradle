plugins {
    id 'com.android.application'
}

android {
    namespace 'za.ac.richfield.smartpantry'
    compileSdk 34

    defaultConfig {
        applicationId "za.ac.richfield.smartpantry"
        // Android 7.0 - the oldest version the module's lab machines can run, and
        // high enough that vector drawables and RecyclerView work without support
        // libraries for either.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // The emulator build used for the demonstration video.
            minifyEnabled false
        }
        release {
            // Left unminified on purpose: R8 shrinking is not assessed here, and a
            // readable stack trace is worth more during marking than a smaller APK.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        // No ViewBinding, no DataBinding: findViewById is what the module teaches and
        // keeps the Activity code explicit about which views it touches.
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
